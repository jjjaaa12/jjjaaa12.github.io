<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cấp quyền TikTok</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; line-height: 1.6; color: #222; }
  textarea { width: 100%; height: 120px; font-size: 14px; }
  button { font-size: 18px; padding: 10px 24px; margin-top: 12px; background: #e8344e; color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  .ok { color: #2e9e5b; font-weight: 700; }
  .err { color: #b3142b; font-weight: 700; }
</style>
</head>
<body>
<h1>Cấp quyền TikTok</h1>
<p id="status"></p>
<p>Chép toàn bộ địa chỉ dưới đây và dán vào cửa sổ lệnh đang chờ (dòng có dấu <code>&gt;</code>):</p>
<textarea id="url" readonly></textarea>
<button id="copy">📋 Chép địa chỉ</button>
<script>
  const box = document.getElementById("url");
  const status = document.getElementById("status");
  box.value = location.href;
  const q = new URLSearchParams(location.search);
  if (q.get("code")) {
    status.textContent = "✅ TikTok đã cho phép. Chép địa chỉ bên dưới.";
    status.className = "ok";
  } else {
    status.textContent = "⚠️ Không có mã cấp quyền: " + (q.get("error_description") || q.get("error") || "hãy thử lại từ đầu.");
    status.className = "err";
  }
  document.getElementById("copy").onclick = () => {
    box.select();
    navigator.clipboard.writeText(box.value);
    document.getElementById("copy").textContent = "✅ Đã chép";
  };
</script>
</body>
</html>
